# Telegraf: copia cada mensaje MQTT del ESP32 a InfluxDB (una "tabla" por tema).
# Contrato de los mensajes: docs/contrato-mqtt.md
[agent]
  interval = "10s"
  flush_interval = "2s"
  omit_hostname = true

# Valores comunes de todas las entradas (TOML no permite heredar, por eso se repiten)
# ---------- Temperatura y humedad medidas ----------
[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  username = "${MQTT_USER_SERVICIOS}"
  password = "${MQTT_PASS_SERVICIOS}"
  client_id = "telegraf-lecturas"
  topics = ["bodega1/lecturas"]
  topic_tag = ""
  data_format = "json"
  tag_keys = ["dispositivo"]
  json_string_fields = ["estado"]
  name_override = "lecturas"

# ---------- Pronóstico del modelo TinyML ----------
[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  username = "${MQTT_USER_SERVICIOS}"
  password = "${MQTT_PASS_SERVICIOS}"
  client_id = "telegraf-pronostico"
  topics = ["bodega1/ia/pronostico"]
  topic_tag = ""
  data_format = "json"
  tag_keys = ["dispositivo"]
  name_override = "pronostico"

# ---------- Acelerómetro y giroscopio ----------
[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  username = "${MQTT_USER_SERVICIOS}"
  password = "${MQTT_PASS_SERVICIOS}"
  client_id = "telegraf-imu"
  topics = ["bodega1/imu"]
  topic_tag = ""
  data_format = "json"
  tag_keys = ["dispositivo"]
  name_override = "imu"

# ---------- Modelo del ventilador (Edge Impulse). probs se guarda como probs_<clase> ----------
[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  username = "${MQTT_USER_SERVICIOS}"
  password = "${MQTT_PASS_SERVICIOS}"
  client_id = "telegraf-ventilador"
  topics = ["bodega1/ia/ventilador"]
  topic_tag = ""
  data_format = "json"
  tag_keys = ["dispositivo"]
  json_string_fields = ["clase"]
  name_override = "ventilador"

# ---------- Clasificación de imágenes (ESP32-CAM) ----------
[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  username = "${MQTT_USER_SERVICIOS}"
  password = "${MQTT_PASS_SERVICIOS}"
  client_id = "telegraf-vision"
  topics = ["bodega1/ia/vision"]
  topic_tag = ""
  data_format = "json"
  tag_keys = ["dispositivo"]
  json_string_fields = ["clase"]
  name_override = "vision"

# ---------- Alarmas que genera la API ----------
[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  username = "${MQTT_USER_SERVICIOS}"
  password = "${MQTT_PASS_SERVICIOS}"
  client_id = "telegraf-alertas"
  topics = ["bodega1/alertas"]
  topic_tag = ""
  data_format = "json"
  tag_keys = ["regla", "nivel"]
  json_string_fields = ["id", "estado", "mensaje"]
  name_override = "alertas"

[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]
  token = "${INFLUX_TOKEN}"
  organization = "bodega"
  bucket = "bodega"
